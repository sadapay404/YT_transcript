name: Windows desktop installer

on:
  pull_request:
    paths:
      - "electron/**"
      - "scripts/prepare-electron.mjs"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build TranStudio Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the standalone Next server and NSIS installer
        run: npm run desktop:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v5
        with:
          name: TranStudio-Windows-${{ github.sha }}
          path: release/TranStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
