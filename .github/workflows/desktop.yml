name: Windows desktop installer

on:
  pull_request:
    paths:
      - "electron/**"
      - "scripts/prepare-electron.mjs"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build TranStudio Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the standalone Next server
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare the standalone Electron payload
        run: npm run desktop:prepare
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build the unsigned NSIS installer
        shell: pwsh
        run: |
          & npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Surface electron-builder failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path electron-builder.log) {
            $log = (Get-Content electron-builder.log -Raw).Trim()
            $escaped = $log.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=electron-builder.log,line=1,title=electron-builder::$escaped"
          }
          exit 1

      - name: Upload desktop build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TranStudio-Windows-build-logs-${{ github.sha }}
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v5
        with:
          name: TranStudio-Windows-${{ github.sha }}
          path: release/TranStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
