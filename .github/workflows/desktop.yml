name: Windows desktop installer

on:
  pull_request:
    paths:
      - "electron/**"
      - "scripts/prepare-electron.mjs"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Tag pushes publish a GitHub Release with the installer attached, which is what
# `/app` links to. `contents: write` is the only permission that needs granting.
permissions:
  contents: write

jobs:
  windows-installer:
    name: Build TranStudio Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the standalone Next server
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare the standalone Electron payload
        run: npm run desktop:prepare
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build the unsigned NSIS installer
        shell: pwsh
        run: |
          & npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Surface electron-builder failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path electron-builder.log) {
            $log = (Get-Content electron-builder.log -Raw).Trim()
            $escaped = $log.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=electron-builder.log,line=1,title=electron-builder::$escaped"
          }
          exit 1

      - name: Upload desktop build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TranStudio-Windows-build-logs-${{ github.sha }}
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v5
        with:
          name: TranStudio-Windows-${{ github.sha }}
          path: release/TranStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      # ── Publishing ────────────────────────────────────────────────────────
      # A tag push creates (or reuses) the release for that tag and attaches the
      # installer, giving a permanent direct URL:
      #   https://github.com/<owner>/<repo>/releases/download/v<version>/TranStudio-Setup-<version>.exe
      # `/app` points at exactly that URL (src/lib/download.ts → downloadUrl).
      # Pull requests and manual runs stop at the artifact upload above.
      - name: Publish the installer to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem release/TranStudio-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer found in release/" }

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "TranStudio $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }

          gh release upload $tag $installer.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload $($installer.Name) to $tag" }

          "Published $($installer.Name) ($($installer.Length) bytes) to release $tag"
          "Direct URL: https://github.com/${{ github.repository }}/releases/download/$tag/$($installer.Name)"
